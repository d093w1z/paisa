name: Docker Image Release
on:
  push:
    branches:
      - ci/docker-*
    tags:
      - '*'
jobs:
  docker:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/paisa', github.repository_owner) }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=paisa-docker
          cache-to: type=gha,mode=max,scope=paisa-docker
      - id: meta-hledger
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/paisa', github.repository_owner) }}
          flavor: |
            latest=auto
            prefix=
            suffix=-hledger,onlatest=true
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          file: ./Dockerfile.hledger
          push: true
          tags: ${{ steps.meta-hledger.outputs.tags }}
          labels: ${{ steps.meta-hledger.outputs.labels }}
          cache-from: type=gha,scope=paisa-docker
          cache-to: type=gha,mode=max,scope=paisa-docker
